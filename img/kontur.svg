<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="880" height="250" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/>
    </marker>
  </defs>
  <text x="20" y="30" font-size="15" font-weight="600" fill="#1f2937">Выпуск отчёта руководителю: где агент, где контроль, где решает человек</text>

  <!-- лента ролей -->
  <g font-size="11" fill="#6b7280">
    <text x="20" y="62">AI-агент</text>
    <text x="196" y="62">автоматика</text>
    <text x="372" y="62">автоматика</text>
    <text x="548" y="62">независимый проверяющий</text>
    <text x="724" y="62">человек</text>
  </g>

  <g font-size="13" fill="#111827">
    <rect x="20" y="72" width="150" height="76" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="32" y="98" font-weight="600">Собирает выпуск</text>
    <text x="32" y="118" font-size="11.5" fill="#374151">P&amp;L, отчёт, Excel</text>
    <text x="32" y="134" font-size="11.5" fill="#374151">из главной книги</text>

    <rect x="196" y="72" width="150" height="76" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="208" y="98" font-weight="600">Контроли расчёта</text>
    <text x="208" y="118" font-size="11.5" fill="#374151">УУ = БУ до копейки,</text>
    <text x="208" y="134" font-size="11.5" fill="#374151">сверка с главной книгой</text>

    <rect x="372" y="72" width="150" height="76" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="384" y="98" font-weight="600">Реестр чисел</text>
    <text x="384" y="118" font-size="11.5" fill="#374151">число в отчёте —</text>
    <text x="384" y="134" font-size="11.5" fill="#374151">только из реестра</text>

    <rect x="548" y="72" width="150" height="76" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="560" y="98" font-weight="600">Слепой пересчёт</text>
    <text x="560" y="118" font-size="11.5" fill="#374151">своим кодом, не видя</text>
    <text x="560" y="134" font-size="11.5" fill="#374151">кода расчёта</text>

    <rect x="724" y="72" width="136" height="76" rx="8" fill="#fef2f2" stroke="#ef4444"/>
    <text x="736" y="98" font-weight="600">Утверждает</text>
    <text x="736" y="118" font-size="11.5" fill="#374151">причины, методика,</text>
    <text x="736" y="134" font-size="11.5" fill="#374151">отправка — по «ок»</text>
  </g>

  <g stroke="#5b6475" stroke-width="1.6" marker-end="url(#a)">
    <line x1="170" y1="110" x2="194" y2="110"/>
    <line x1="346" y1="110" x2="370" y2="110"/>
    <line x1="522" y1="110" x2="546" y2="110"/>
    <line x1="698" y1="110" x2="722" y2="110"/>
  </g>

  <path d="M623,148 C623,200 95,200 95,152" fill="none" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="250" y="214" font-size="12" fill="#b91c1c">расхождение хотя бы в одном числе — выпуск остановлен и возвращён на исправление</text>
  <text x="20" y="240" font-size="11" fill="#6b7280">Каждый этап оставляет след: реестр, протокол контролей, протокол проверки, журнал решений.</text>
</svg>
